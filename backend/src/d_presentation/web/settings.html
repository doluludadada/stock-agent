<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technical Settings</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6676; --line: #d9dde4;
    --accent: #1f5fbf; --accent-text: #ffffff; --error: #b42318; --error-bg: #fdecea; --ok: #1a7f37; --ok-bg: #e7f5ec;
    --input-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --text: #e4e8ef; --muted: #9aa3b2; --line: #2e3542;
      --accent: #5b9bff; --accent-text: #0b1220; --error: #ff8a80; --error-bg: #3a1d1d; --ok: #6fd28b; --ok-bg: #16301f;
      --input-bg: #12161d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  p.lead { color: var(--muted); margin: 0 0 20px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; margin-left: 6px; }
  label { display: block; font-weight: 600; font-size: 13px; }
  input, select { background: var(--input-bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  input[type=number] { width: 100%; }
  input[aria-invalid=true] { border-color: var(--error); outline: 1px solid var(--error); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px 16px; }
  .field .hint { color: var(--muted); font-weight: 400; font-size: 12px; }
  .field-error, .rule-error { color: var(--error); font-size: 12px; margin-top: 4px; }
  ul.rules { margin: 0; padding-left: 18px; }
  ul.rules li { margin: 2px 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: .6; cursor: progress; }
  #message:empty { display: none; }
  #message { border-radius: 6px; padding: 10px 12px; margin-bottom: 16px; }
  #message.ok { background: var(--ok-bg); color: var(--ok); }
  #message.error { background: var(--error-bg); color: var(--error); }
  #message ul { margin: 6px 0 0; padding-left: 18px; }
  details summary { cursor: pointer; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Technical settings</h1>
  <p class="lead">Indicator parameters of each technical strategy. A save applies to the next workflow; a workflow already running keeps the settings it started with.</p>

  <div id="message" role="status" aria-live="polite"></div>

  <section>
    <h2>In use</h2>
    <div class="row">
      <div>Full Cycle, Intraday and analysis: <strong id="active-strategy" class="mono">-</strong></div>
      <div>Social Buzz: <strong id="buzz-strategy" class="mono">-</strong></div>
    </div>
  </section>

  <section>
    <div class="row">
      <div>
        <label for="strategy">Strategy</label>
        <select id="strategy"></select>
      </div>
      <div>
        <label for="token">API token</label>
        <input id="token" type="password" autocomplete="off" placeholder="API_TOKEN" size="24">
      </div>
    </div>
  </section>

  <section>
    <h2>Indicator parameters</h2>
    <form id="indicators" class="grid" novalidate></form>
  </section>

  <section>
    <details>
      <summary>Scoring and rules of this strategy (read only)</summary>
      <p id="scoring" class="mono"></p>
      <ul id="rules" class="rules mono"></ul>
    </details>
  </section>

  <div class="actions">
    <button id="save" class="primary" type="button">Save</button>
    <button id="reset" type="button">Reset to config/technical.yaml</button>
    <button id="reload" type="button">Reload</button>
  </div>
</main>

<script>
const API = "/v1/technical-settings";
const state = { document: null, indicatorSchema: {}, strategyId: null };
const $ = (id) => document.getElementById(id);

function remembered(key) {
  try { return sessionStorage.getItem(key) || ""; } catch { return ""; }
}
function remember(key, value) {
  try { sessionStorage.setItem(key, value); } catch { /* storage blocked: the field still works for this page */ }
}

function showMessage(kind, text, items = []) {
  const box = $("message");
  box.className = kind;
  box.textContent = text;
  if (items.length) {
    const list = document.createElement("ul");
    for (const item of items) {
      const li = document.createElement("li");
      li.textContent = item;
      list.append(li);
    }
    box.append(list);
  }
}

function bounds(property) {
  const parts = [];
  if (property.exclusiveMinimum !== undefined) parts.push(`> ${property.exclusiveMinimum}`);
  if (property.minimum !== undefined) parts.push(`≥ ${property.minimum}`);
  if (property.maximum !== undefined) parts.push(`≤ ${property.maximum}`);
  if (property.exclusiveMaximum !== undefined) parts.push(`< ${property.exclusiveMaximum}`);
  return [property.type === "integer" ? "whole number" : "number", ...parts].join(", ");
}

function render() {
  const doc = state.document;
  $("active-strategy").textContent = doc.active_strategy_id;
  $("buzz-strategy").textContent = doc.buzz_strategy_id;

  const select = $("strategy");
  select.replaceChildren();
  for (const id of Object.keys(doc.strategies)) {
    const option = document.createElement("option");
    const roles = [id === doc.active_strategy_id && "active", id === doc.buzz_strategy_id && "buzz"].filter(Boolean);
    option.value = id;
    option.textContent = roles.length ? `${id} (${roles.join(", ")})` : id;
    select.append(option);
  }
  if (!(state.strategyId in doc.strategies)) state.strategyId = doc.active_strategy_id;
  select.value = state.strategyId;

  const strategy = doc.strategies[state.strategyId];
  const form = $("indicators");
  form.replaceChildren();
  for (const [name, property] of Object.entries(state.indicatorSchema)) {
    const field = document.createElement("div");
    field.className = "field";
    field.innerHTML = `<label for="field-${name}">${property.title || name} <span class="hint mono">${name}</span></label>`
      + `<input id="field-${name}" name="${name}" type="number" step="${property.type === "integer" ? 1 : "any"}" aria-describedby="error-${name}">`
      + `<div class="hint">${bounds(property)}</div><div id="error-${name}" class="field-error"></div>`;
    field.querySelector("input").value = strategy.indicators[name];
    form.append(field);
  }

  const scoring = strategy.scoring;
  $("scoring").textContent = Object.entries(scoring).map(([key, value]) => `${key}=${value}`).join("  ");
  const rules = $("rules");
  rules.replaceChildren();
  strategy.rules.forEach((rule, index) => {
    const { type, effect, ...parameters } = rule;
    const li = document.createElement("li");
    const text = Object.entries(parameters).map(([key, value]) => `${key}=${value}`).join(" ");
    li.textContent = `${type} (${effect}) ${text}`;
    const error = document.createElement("div");
    error.id = `rule-error-${index}`;
    error.className = "rule-error";
    li.append(error);
    rules.append(li);
  });
}

function clearErrors() {
  document.querySelectorAll(".field-error, .rule-error").forEach((element) => { element.textContent = ""; });
  document.querySelectorAll("input[aria-invalid]").forEach((element) => element.removeAttribute("aria-invalid"));
}

function readValue(name, property) {
  const raw = $(`field-${name}`).value.trim();
  const number = Number(raw);
  const valid = raw !== "" && Number.isFinite(number) && (property.type !== "integer" || Number.isInteger(number));
  return valid ? number : raw;
}

function editedDocument() {
  const doc = structuredClone(state.document);
  const indicators = doc.strategies[state.strategyId].indicators;
  for (const [name, property] of Object.entries(state.indicatorSchema)) indicators[name] = readValue(name, property);
  return doc;
}

function showFieldErrors(details) {
  const elsewhere = [];
  for (const detail of details) {
    const path = detail.loc.slice(2);
    const [section, strategyId, part, key] = path;
    const ownStrategy = section === "strategies" && strategyId === state.strategyId;
    const fieldError = ownStrategy && part === "indicators" && $(`error-${key}`);
    const ruleError = ownStrategy && part === "rules" && $(`rule-error-${key}`);
    const slot = fieldError || ruleError;
    if (slot) {
      slot.textContent = slot.textContent ? `${slot.textContent}; ${detail.msg}` : detail.msg;
      if (fieldError) $(`field-${key}`).setAttribute("aria-invalid", "true");
      if (ruleError) $("rules").closest("details").open = true;
    } else {
      elsewhere.push(`${path.join(" › ")}: ${detail.msg}`);
    }
  }
  return elsewhere;
}

async function request(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  const token = $("token").value.trim();
  if (token) headers.Authorization = `Bearer ${token}`;
  const response = await fetch(path, { method, headers, body: body && JSON.stringify(body) });
  const payload = await response.json().catch(() => ({}));
  return { response, payload };
}

function refusal(response, payload) {
  if (response.status === 401) return "The API token is missing or wrong.";
  if (response.status === 403) return "Writes are disabled on this server: set API_TOKEN and restart it.";
  return typeof payload.detail === "string" ? payload.detail : `Request failed with HTTP ${response.status}.`;
}

async function load() {
  const [{ response, payload }, schema] = await Promise.all([request("GET", API), request("GET", `${API}/schema`)]);
  if (!response.ok) {
    showMessage("error", `Could not load the settings: ${refusal(response, payload)}`);
    return;
  }
  state.document = payload;
  state.indicatorSchema = schema.payload.$defs.IndicatorParametersSchema.properties;
  clearErrors();
  render();
}

async function write(button, method, path, body, confirmation, done) {
  if (!window.confirm(confirmation)) return;
  button.disabled = true;
  try {
    const { response, payload } = await request(method, path, { confirm: true, ...body });
    if (response.ok) {
      state.document = payload;
      clearErrors();
      render();
      showMessage("ok", done);
    } else if (response.status === 422 && Array.isArray(payload.detail)) {
      const elsewhere = showFieldErrors(payload.detail);
      showMessage("error", "Nothing was saved. Fix the fields marked below.", elsewhere);
    } else {
      showMessage("error", `Nothing was saved. ${refusal(response, payload)}`);
    }
  } catch (error) {
    showMessage("error", `Nothing was saved. The server could not be reached: ${error.message}`);
  } finally {
    button.disabled = false;
  }
}

$("token").value = remembered("stock-agent-api-token");
$("token").addEventListener("change", () => remember("stock-agent-api-token", $("token").value.trim()));
$("strategy").addEventListener("change", (event) => { state.strategyId = event.target.value; clearErrors(); render(); });
$("reload").addEventListener("click", () => { showMessage("", ""); load(); });
$("save").addEventListener("click", (event) => {
  clearErrors();
  write(event.target, "PUT", API, { settings: editedDocument() },
    `Save the indicator parameters of "${state.strategyId}"? The next workflow uses them.`,
    `Saved. The next workflow uses the parameters of "${state.strategyId}".`);
});
$("reset").addEventListener("click", (event) => {
  write(event.target, "POST", `${API}/reset`, {},
    "Delete the saved settings and use config/technical.yaml again?",
    "Reset. The next workflow uses config/technical.yaml.");
});

load();
</script>
</body>
</html>
