[project]
name = "stock-agent"
version = "0.1.0"
description = "Taiwan stock screening, P/E valuation and mock trading agent with a CLI, a Web API and a LINE chatbot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.3.5",
    "fastapi>=0.121.0",
    "google-generativeai>=0.8.5",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "openai>=2.7.1",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.38.0",
    "pandas>=2.3.3",
    "numpy>=2.2.6",
    "shioaji>=1.3.1",
    "sqlalchemy[asyncio]>=2.0.45",
    "sqlmodel>=0.0.31",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "yfinance>=1.2.0",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "anthropic>=2.4.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pathspec>=0.12.1",
    "pyright>=1.1.414",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "rich>=14.2.0",
    "ruff>=0.14.3",
]


[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff]
line-length = 135
target-version = "py314"
extend-exclude = ["tests/fixtures/architecture"]

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "FAST", "I", "UP", "SIM"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportImplicitOverride = "error"
reportDeprecated = "error"
# SQLModel declares __tablename__ as a declared_attr, so every table DTO that names its table would trip this rule.
executionEnvironments = [{ root = "src/c_infrastructure/database/models", extraPaths = ["src"], reportIncompatibleVariableOverride = "none" }]

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
