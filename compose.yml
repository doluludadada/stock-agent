# The whole site on one server: `docker compose up -d --build` from the repository root. frontend/docs/deployment.md
# has the steps. Compose reads STATE_DIR, DB_USER, DB_PASSWORD, DB_NAME, PROXY_BIND, PROXY_PORT, SITE_NAME, LAN_NAME, APP_UID and
# APP_GID from .env. Only the frontend service (Caddy) publishes a port. Each image names its version, so an update is a change to this file
# or to a Dockerfile, never what a registry serves that day. No container gains a privilege it did not start with, and
# each keeps only the capabilities it uses.

services:
  database:
    container_name: stock-agent-database
    # postgres:18.7 with pgvector (database/Dockerfile).
    build: ./database
    # The image's entrypoint starts as root, gives the data folder to the postgres user and drops to it.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    # For a server with 7 GB that also replays backtests in the backend: a small buffer pool, and sorts that stay small
    # however many connections run them. The backend opens at most 15 connections per set of settings.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=50
      # Log lines in Taipei time, as the backend's; the database's own time zone for data stays UTC.
      - -c
      - log_timezone=Asia/Taipei
    shm_size: 256mb
    volumes:
      # The image keeps its data in /var/lib/postgresql/18/docker.
      - ${STATE_DIR:?Set STATE_DIR in .env to the folder that keeps everything the site saves}/postgres:/var/lib/postgresql
    networks:
      site:
        ipv4_address: 172.31.88.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    container_name: stock-agent-backend
    build: ./backend
    # A terminal, so the log keeps its colours in `docker logs` and in a container viewer.
    tty: true
    # The user that owns STATE_DIR on the host, so the app can write its files there.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    environment:
      HOST: 0.0.0.0
      # Log lines in Taipei time. Every clock of the app names its zone (Asia/Taipei or UTC), so only the log changes.
      TZ: Asia/Taipei
      DB_HOST: database
      DB_PORT: "5432"
      # uvicorn reads the visitor's address and scheme only from the proxy and from the gateway, which is the address
      # the proxy names for a request that `tailscale serve` forwarded.
      FORWARDED_ALLOW_IPS: 172.31.88.1,172.31.88.2
      # Whatever .env sets: no usage telemetry from ONNX Runtime or the Hugging Face client (backend/Dockerfile).
      ORT_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      # The project root of the app: config/, which the settings editor writes, secrets/, backups/, .settings-admin/
      # and the archives.
      - ${STATE_DIR:?Set STATE_DIR in .env to the folder that keeps everything the site saves}:/state
    networks:
      site:
        ipv4_address: 172.31.88.3
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    # A stop waits at most 5 s for open requests (backend/main.py), then cancels each run: a SinoPac call in flight
    # ends (5 s; when its answer was lost, the lookups for it end at the cancel and take at most
    # shioaji.status_timeout_seconds in all), then the order cancels its working odd-lot part and reads its deals
    # within shioaji.cancel_timeout_seconds. 5 + 5 + 30 + 5 + 15 s with the shipped settings.
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/v1/auth/status', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 120s

  # The web app: Caddy serves the built frontend and forwards /v1 to the backend.
  frontend:
    container_name: stock-agent-frontend
    build: ./frontend
    # Not root (frontend/Dockerfile), on a port above 1023, so it needs no capability at all.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SITE_NAME: ${SITE_NAME:-localhost}
      # A second name the proxy answers, which compose.lan.yml publishes: the server's address on the home network.
      LAN_NAME: ${LAN_NAME:-127.0.0.1}
    ports:
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8080}:8080"
    networks:
      site:
        ipv4_address: 172.31.88.2
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  site:
    ipam:
      config:
        # Fixed, so the backend can name the proxy and the gateway, and frontend/Caddyfile the gateway.
        - subnet: 172.31.88.0/29
          gateway: 172.31.88.1
