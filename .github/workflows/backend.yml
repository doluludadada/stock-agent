name: Backend

on:
    push:
        paths: ["backend/**", "config/**", ".github/workflows/backend.yml"]
    pull_request:
        paths: ["backend/**", "config/**", ".github/workflows/backend.yml"]

jobs:
    check:
        name: Format, lint, architecture & tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        # The tests create and drop their own database as this role (backend/tests/support/databases.py), as on a
        # developer's machine, so they need no environment variable. The image has pgvector, and the role is its
        # superuser, so the tests create the vector extension as this role.
        services:
            postgres:
                image: pgvector/pgvector:0.8.7-pg18-trixie
                env:
                    POSTGRES_USER: stock_agent_test
                    POSTGRES_PASSWORD: stock_agent_test
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U stock_agent_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v7
            # setup-uv publishes no floating major tag, so this names the release.
            - uses: astral-sh/setup-uv@v10.3.3
            # uv installs the Python that backend/.python-version names.
            - run: uv sync --frozen
            - run: uv run ruff format --check
            - run: uv run ruff check
            # Exits 1 unless the count ends at TOTAL 0.
            - run: uv run python tools/architecture_check.py src --pyright
            # pg_dump and pg_restore of the service's major version, which the database commands' tests run.
            - name: PostgreSQL 18 client programs
              run: |
                  sudo apt-get install -y --no-install-recommends postgresql-common
                  sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
                  sudo apt-get install -y --no-install-recommends postgresql-client-18
                  echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
            - run: uv run pytest -q
            # Fails on a known vulnerability in any locked dependency, the dev group included. Each ignore names one
            # that no release this lock can take fixes:
            # - filelock (the thirteen CVE ids): fixed in 4.2.1, which needs a newer shioaji than the locked 1.3.1. The
            #   broker SDK changes only together with the order-gate verification. Remove these with that upgrade.
            - name: Dependency audit
              run: |
                  uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
                  uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip \
                      --ignore-vuln CVE-2026-112907 --ignore-vuln CVE-2026-112908 --ignore-vuln CVE-2026-112909 \
                      --ignore-vuln CVE-2026-112910 --ignore-vuln CVE-2026-112911 --ignore-vuln CVE-2026-112912 \
                      --ignore-vuln CVE-2026-112913 --ignore-vuln CVE-2026-112915 --ignore-vuln CVE-2026-112935 \
                      --ignore-vuln CVE-2026-112936 --ignore-vuln CVE-2026-112938 --ignore-vuln CVE-2026-112939 \
                      --ignore-vuln CVE-2026-112940
