name: Frontend

# The Playwright suite (bun run e2e) is not here: it drives a real backend with live market data and an AI key.
# frontend/README.md says how to run it locally.
on:
    push:
        paths: ["frontend/**", "config/strategies/**", ".github/workflows/frontend.yml"]
    pull_request:
        paths: ["frontend/**", "config/strategies/**", ".github/workflows/frontend.yml"]

jobs:
    check:
        name: Lint, typecheck, test & build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2
            - run: bun install --frozen-lockfile
            # Fails on a known vulnerability in any locked package. Both ignores are packages that only shadcn, the
            # component generator, uses, and its ranges allow no fixed release: deepmerge (GHSA-gcqx-w48m-w2h4) and
            # minimatch (GHSA-g3hv-75wg-m249). The build takes only shadcn's stylesheet, so neither reaches the bundle.
            - run: bun audit --ignore=GHSA-gcqx-w48m-w2h4 --ignore=GHSA-g3hv-75wg-m249
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run test
            - run: bun run build
