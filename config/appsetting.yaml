        quote_fields: { stock_id: "代號", open: "開盤", high: "最高", low: "最低", close: "收盤", volume: "成交股數", change: "漲跌" }
        index_prices_url: "https://www.tpex.org.tw/www/zh-tw/indexInfo/inx?date={date:%Y/%m/01}&response=json"
        index_price_fields: { date: "日期", open: "開市", high: "最高", low: "最低", close: "收市" }
