# config/appsetting.yaml

# dev: a developer's machine. test: staging before launch. prod: the live service, PostgreSQL only. A personal site's
# Shioaji login, which its realtime quotes and its SinoPac orders share, is on SinoPac's simulation server with the
# *_TEST key pair in dev and test, and on the real account with the production credentials in prod: only prod places a
# real-money order. dev and test refuse to start while a production Shioaji credential is set. Neither the Web editor
# nor a reload changes it: restart.
environment: dev

# personal: the owner's own machine, with the daily history and index trend of the exchanges' own daily reports,
# Shioaji's realtime quotes, and SinoPac for the runs an administrator starts on it. Without the environment's Shioaji
# key pair it has no realtime quote, so Buzz and Intraday are refused and it orders nothing. public: a
# free public website on open-licensed data only. Its daily history and index trend come from the open-data archive of
# the TWSE and TPEX OpenAPI closes, it has no realtime quote, so Buzz, Intraday and manual BUY are refused, and it trades
# on the mock broker only.
audience: personal

ai:
  # claude reads ANTHROPIC_API_KEY. nvidia (NVIDIA_API_KEY) is configured too; its deepseek model did not answer on
  # 2026-11-03, so Claude Haiku is active.
  active_model: claude
  connection_timeout: 60
  temperature: 0.7
  max_output_tokens: 16000
  available_models:
    openai: gpt-5.5-mini
    grok: grok-4.7
    gemini: gemini-2.5-flash
    groq: openai/gpt-oss-20b
    nvidia: deepseek-ai/deepseek-v4.1-flash
    claude: claude-haiku-5-5
  # The models a user may pick for their own runs on My settings, besides active_model, the default: for example
  # [openai, gemini]. Each needs its entry above and its API key, or the app does not start.
  user_selectable: []
  article_content_length: 500

behavior:
  log_level: INFO
  enable_web_search: false
  enable_x_search: false
  enable_inline_citations: true
  web_search_max_results: 3
  web_search_triggers:
    [
      "latest",
      "recent",
      "news",
      "current",
      "today",
      "stock",
      "weather",
      "時事",
      "今天",
      "最新",
      "新聞",
      "查詢",
    ]

db:
  # The PostgreSQL database is named by DB_USER, DB_PASSWORD, DB_HOST, DB_PORT and DB_NAME in .env: the app refuses to
  # start without them.
  chroma_persist_path: "chroma_data"

chat:
  reset_commands:
    - clear
    - reset
  reset_reply: "✨ Memory cleared. Let's start over."

technical:
  # The developer's strategies, in menu order: each is config/strategies/<id>.json. Saving settings never changes them.
  built_in_strategies: [balanced]
  # An owner's first settings copy every built-in strategy and select this one for every workflow.
  initial_strategy_id: balanced

ranking:
  # A monthly stock ranking: `just ranking` prints the latest one and `just ranking-backtest` replays it. It reads only
  # the held daily history and monthly revenue (`just backfill-history` brings them back), never orders and asks no AI.
  # Each month decides at the close of its first session on this day of the month or later, which reads the newest month
  # of revenue due before it (sources.mops.revenue_deadline_day), and holds the ranking from the next session's open.
  decision_day: 13
  # The formula the ranking, every stock's score, the backtest shown and a follow use now: one of the names below. The
  # settings page switches it, and the switch applies at once.
  active_formula: revenue_and_high
  # The formulas the ranking can be made by. Each ranks its factors among its universe's stocks and holds the `top` best
  # sums of ranks in equal weights. Adding one is an entry here, of these factors:
  #   revenue_acceleration  the mean revenue of the latest short_months over that of the latest long_months
  #   revenue_yoy           the revenue of the latest `months` months over the same months a year before
  #   nearness_to_high      the total-return level at the decision over its highest of the last high_sessions sessions
  #   price_momentum        the total-return level skip_sessions sessions ago over the level `sessions` sessions ago
  # The universe is the stocks (no ETF) that traded at the decision, closed at min_close or more, and traded
  # min_traded_value NT$ a session on average over the last traded_value_sessions sessions. With
  # cash_under_average_sessions, the formula holds cash for the month when benchmark_id closed under its own average of
  # that many sessions at the decision. The research of 2026-11-15 on 2008 to 2026 found no formula that beats the first
  # out of sample; the one with the cash filter fell less in 2008 to 2012 and returned less in every later span.
  formulas:
    - name: revenue_and_high
      top: 20
      min_close: 10
      min_traded_value: 30000000
      traded_value_sessions: 20
      factors:
        - kind: revenue_acceleration
          short_months: 3
          long_months: 12
        - kind: nearness_to_high
          high_sessions: 250
    - name: revenue_and_high_cash_60
      top: 20
      min_close: 10
      min_traded_value: 30000000
      traded_value_sessions: 20
      cash_under_average_sessions: 60
      factors:
        - kind: revenue_acceleration
          short_months: 3
          long_months: 12
        - kind: nearness_to_high
          high_sessions: 250
  # The ranking page compares every formula over the same period, and a second time with this liquidity floor in place
  # of its own min_traded_value.
  evidence_min_traded_value: 200000000
  # How many replays of the ranking the site keeps in memory while the history they read stays the same.
  kept_backtests: 24
  # The revenue trend of the stock page and of My holdings: the mean revenue of the latest revenue_short_months over that
  # of the latest revenue_long_months.
  revenue_short_months: 3
  revenue_long_months: 12
  # A day's move beyond this on a bar the exchange named no reference price for is a corporate action, not a return, and
  # counts as 0 in the total-return level.
  daily_limit: 0.105
  # The backtest's benchmark, held over the same sessions by its total return, which a formula's cash filter reads too,
  # and the sessions a year its annual return counts.
  benchmark_id: "0050"
  sessions_per_year: 245

folder:
  news_archive_dir: "news_archive"
  buzz_archive_dir: "buzz_archive"
  ai_response_dir: "ai_responses"

tavily:
  search_depth: basic
  connection_timeout: 30

analysis:
  # Daily history is fetched by calendar days, but a strategy counts trading days (bars). About 1.5 calendar days pass
  # per trading day; 1.9 leaves room for the Lunar New Year closure and trading halts. The window is the larger of
  # lookback_days and the strategy's bars x 1.9, so the built-in strategies (61 bars, 116 days) keep the 120-day window.
  # A stock that still gets too few bars fails the technical step; it is never scored on partial history.
  lookback_days: 120
  history_calendar_days_per_bar: 1.9

  technical_weight: 0.5
  ai_weight: 0.5

  min_combined_score_buy: 80
  max_combined_score_sell: 30

  risk_per_trade_pct: 0.02
  stop_loss_pct: 0.10
  # A BUY quantity is a multiple of this many shares: 1 sizes odd lots, 1000 whole board lots.
  lot_size: 1
  # Most AI factors and soft technical failures a decision reason lists.
  reason_item_limit: 3

  article_fetch_limit: 10
  # A public site reads no news site: its AI step reads the material information the open-data archive holds of a
  # stock from this many days back, and decides a stock with none on its technical score alone, without an AI call.
  material_information_days: 30

notifications:
  enabled: false
  recipients: []

# The Buzz report's social sentiment. Report only: it never changes signals or orders.
sentiment:
  # A post classified with less confidence than this counts as unclear.
  min_confidence: 0.5
  # With fewer bullish, bearish or neutral posts than this, the stock's consensus is unclear.
  min_opinions: 2
  # The share of the opinions one stance needs to be the consensus. Above one half, so only one stance can reach it.
  consensus_share: 0.6

collect_rules:
  spam_keywords:
    - "廣告"
    - "廣編"
    - "業配"
    - "新聞稿"

  financial_keywords:
    - "營收"
    - "EPS"
    - "毛利"
    - "純益"
    - "法說"
    - "殖利率"
    - "擴廠"
    - "減資"
    - "購併"
    - "財報"
    - "股利"
    - "盈餘"
    - "轉盈"

  buzz_min_mentions: 20
  buzz_min_engagement: 100
  social_article_limit: 100

  ptt_lookback_days: 14

  ptt_tags:
    - "[標的]"
    - "[新聞]"

quality:
  min_chars_stock: 100
  min_chars_news: 200
  min_chars_gossip: 50

stock_page:
  # A stock's page: its financial analysis reads held data only. On a personal site its news and board posts are
  # fetched when a page asks, then served again for this many minutes before the news sites and PTT are asked anew.
  news_freshness_minutes: 30
  # The stocks whose fetched news and posts stay in memory, the most recently asked first.
  news_held_stocks: 300
  # The sessions of a valuation ratio the page needs before it compares the latest with their median.
  valuation_min_sessions: 60
  # How many of the latest quarters the page reads the EPS of from the MOPS pages a personal site holds
  # (`just backfill-history` brings them back).
  eps_quarters: 12
  brief:
    # The page's AI brief: what the company is and how the held facts of a recent window relate to the stock's move.
    # One is written per stock and Taiwan calendar day for the whole site, when a signed-in viewer asks for it; every
    # later viewer reads the stored one. Its prompt is stock_brief_prompt in config/instructions.yaml.
    # How many stocks may get a new brief per Taiwan calendar day at viewers' requests, for all users together. The
    # briefs the site writes by itself (system_writing below) take none of them.
    daily_stocks: 30
    # The language every brief is written in: zh-TW or en.
    language: zh-TW
    # The latest sessions whose price move a brief describes.
    window_sessions: 20
    # What it says about the stock it searches for in the article store (article_store below), with the queries
    # stock_brief_rise_query, stock_brief_fall_query and stock_brief_company_query of config/instructions.yaml.
  system_writing:
    # The site's own writing. Once a session's daily data is held, the Web API's timer makes sure each stock of the
    # monthly ranking's top (ranking.top) has its company card and the day's brief, after reading the company's main
    # business and annual report where a personal site may. It asks the AI model ai.system_model (Claude unless the
    # file sets another), and its calls are counted here, apart from every user's allowance and from
    # stock_page.brief.daily_stocks. This is how many paid AI calls it may make per Taiwan calendar day: a brief is
    # one, and a card one more when it is written. 0, and a file that does not set it, turn the site's own writing off.
    daily_ai_calls: 60
  article_store:
    # What the site read about each stock is kept so that it accumulates: announcements and TWSE news with their text,
    # and on a personal site news articles and PTT posts. Articles enter when a stock page asks for the stock's news,
    # when the Web API's timer reads the stocks users hold or watch, and with
    # `just backfill-articles`. Each has a vector, computed on the server, that finds it by meaning.
    # An article published longer ago than this many days is dropped.
    retention_days: 730
    # The most articles kept of one stock, the newest first.
    max_per_stock: 300

world:
  # The world outside Taiwan's exchanges: the items of the world news feeds named under sources.world, kept in the
  # article store with the title and the summary each feed gives, never an article's page; the world indicators' daily
  # readings; and the day's world brief. The Web API's world timer reads the feeds every api.world_interval_minutes.
  # features.world shows the world page; off, nothing is read or written.
  # A world news item published longer ago than this many days is dropped. A brief keeps the items it cites.
  retention_days: 14
  brief:
    # The day's world brief: what moved in the held indicators and which held world news may bear on Taiwan's market,
    # one per Taiwan calendar day, written by the site's own writing on ai.system_model. It spends one of
    # stock_page.system_writing.daily_ai_calls a day, so a budget of 0 writes none. Its prompt is world_brief_prompt in
    # config/instructions.yaml, and its language stock_page.brief.language.
    # The Taiwan time from which the day's brief is written: after the United States session's close and its yields,
    # before the Taiwan open.
    write_at: "07:30"
    # The hours of world news before its writing a brief reads.
    window_hours: 24

market:
  fee_rate: 0.001425
  # Securities transaction tax on a SELL: stocks, and ETFs (codes starting with 00).
  tax_rate: 0.003
  etf_tax_rate: 0.001
  # A bond ETF (a 00 code ending in B, such as 00679B) sold on or before this trading date pays no transaction tax;
  # after it, etf_tax_rate.
  bond_etf_tax_exempt_until: 2026-12-31
  min_fee: 20
  # Shares in one board lot, the exchange's trading unit. Fewer shares trade as an intraday odd lot.
  board_lot_shares: 1000
  # The exchanges' price grid, the same on TWSE and TPEx: from each band's lowest price up, a limit price is a multiple
  # of the band's tick, or the exchange refuses the order. Sources, read 2026-10-31: the TWSE trading mechanism page,
  # regular trading, tick sizes (https://www.twse.com.tw/zh/products/system/trading.html), and the TPEx trading system
  # overview, section 4, tick sizes (https://www.tpex.org.tw/zh-tw/mainboard/trading/rules/system.html).
  stock_ticks:
    { 0: "0.01", 10: "0.05", 50: "0.1", 100: "0.5", 500: "1", 1000: "5" }
  etf_ticks: { 0: "0.01", 50: "0.05" }
  # A quote this close to a tick, as a fraction of the tick, is that tick carried through a binary float: a float32
  # price source serves 28.35 as 28.350000381469727.
  tick_float_tolerance: "0.01"

freshness:
  # Realtime quotes older than this never price an order.
  realtime_max_lag_minutes: 15
  # Daily history whose last bar is older than this is not analysed.
  history_max_lag_days: 10
  # The run error for daily histories that lack the last settled session names at most this many stocks.
  missing_session_listed_stocks: 10
  # An official close that prices a P/E valuation is stale once more weekday sessions than this have closed after
  # its session. One is tolerated because the exchanges publish a day's close hours after 13:30.
  daily_close_max_missed_sessions: 1

# The regular TWSE and TPEx trading day, Asia/Taipei time, Monday to Friday. Orders are taken from the opening
# auction; the closing call auction takes limit ROD orders only.
market_hours:
  opening_auction_start: "08:30"
  continuous_start: "09:00"
  closing_auction_start: "13:25"
  close: "13:30"
  # A session's daily bar is final in every price source from this time: the after-hours fixed-price session ends at
  # 14:30, and a source may publish the session's bars later still.
  settled: "15:00"

# How the price and listing adapters pace, batch and cache their requests.
market_data:
  # Shioaji realtime quotes: at most 500 stocks per snapshots request, and 50 market-data queries per 10 s, after which
  # it stops answering for a minute.
  quote_batch_size: 500
  quote_request_interval_seconds: 0.2
  quote_timeout_seconds: 10.0
  # The quotes the pages show while a session trades (GET /v1/market/quotes) are held once for every page and user:
  # one snapshots request, of at most quote_batch_size stocks, at most every page_quote_refresh_seconds, for the stocks
  # a page asked for in the last page_quote_idle_seconds. A stock that has no quote yet may bring the next request
  # forward to page_quote_first_seconds after the last. So the stocks cost Shioaji 1 query per 10 s as shipped, and 5
  # at the most, of the 50 it allows; an order's quote is asked for itself and waits for no page. Once a session is
  # over and its last quotes are read, an open page asks again every page_quote_recheck_seconds, which costs Shioaji
  # nothing. One request of a page names at most quote_batch_size stocks.
  page_quote_refresh_seconds: 10
  page_quote_first_seconds: 2
  page_quote_idle_seconds: 60
  page_quote_recheck_seconds: 300
  # The market overview's index while a session trades (GET /v1/market/index-quotes), for a signed-in viewer: one more
  # snapshots request, of the index contracts alone, in the round that reads the pages' stocks, so at most every
  # page_quote_refresh_seconds whatever the number of open tabs, and only while a tab asks. With it the pages cost
  # Shioaji 2 queries per 10 s as shipped (1 while only the market overview is open) and 10 at the most, of the 50 it
  # allows. One tab left on the home page for a whole session asks 1,621 times, each for one contract: 1,620 in the
  # 4.5 hours from 09:00 to 13:30 and once after the close. Nothing is asked for an index before 09:00, when it still
  # stands at the previous close. Each index is read from Shioaji's Contracts.Indexs[exchange][symbol].
  quote_index_contracts:
    taiex:
      exchange: TSE
      symbol: TSE001
  # Daily history on a personal site, from the exchanges' own reports of each date (sources.exchange.daily_reports):
  # one request per exchange and session for every listed stock, and two per exchange and month for its index. TWSE
  # refuses an address for minutes after more than about 3 requests in 5 seconds, so each site is asked at most once
  # this often, from every runtime together.
  history_request_interval_seconds: 3.0
  history_timeout_seconds: 30.0
  # Sessions the Web API's timer keeps for every stock: the stock page's one-year chart (250 sessions and the one
  # before them). A strategy that needs older sessions fetches them when it runs.
  history_backfill_bars: 251
  # A question the exchanges answered with nothing new, such as a session they do not serve yet, or one that failed,
  # as every request does while a site refuses the address, is asked again at most this often.
  history_retry_hours: 2
  # The TWSE and TPEX listings, with each stock's latest official close.
  listing_cache_hours: 6
  listing_timeout_seconds: 30.0

trading:
  # Buzz, Intraday and a manual BUY order on the account their run chose when it started: the user's mock account, the
  # default, or for an administrator on a personal site with a Shioaji login SinoPac, on its simulation server in dev
  # and test and on the real account in prod. A follow of a run orders on the mock account only. A follow of the
  # monthly ranking orders on the mock account or, for such an administrator, on SinoPac's simulation server, and is
  # refused on the real account whatever these settings say. These two limits hold every SinoPac BUY, checked as it
  # is sent; a SELL is never held to them and sells only shares the account holds.
  # Most NT$ one SinoPac BUY may cost at its limit price, fees aside.
  max_order_value: 100000
  # Most NT$ the SinoPac BUYs of one Taiwan calendar day may cost together at their limit prices, counted from the
  # trading journal, where each order is saved before it is sent.
  max_daily_buy_value: 300000

mock_trading:
  # Each user's mock account starts with this cash the first time it is read.
  initial_cash: 1000000

accounts:
  # Paid AI calls (stock analysis, valuation explanations, Buzz sentiment) a user may make per Taiwan calendar day.
  # Administrators have no such limit; their calls still count toward the server's total below.
  daily_ai_calls: 60
  # Paid AI calls of every user together per Taiwan calendar day. Past it, users' calls are refused until midnight.
  # An administrator's calls count toward it and are never refused.
  daily_ai_calls_total: 600
  # true: anyone may register as a user once the first administrator exists. A user trades on their own mock account
  # only. prod, the environment with the real SinoPac account, refuses to start with it on.
  registration_open: false
  # Failed sign-ins before the next is refused for the window: per sign-in name and client address, and per address.
  sign_in_failures_per_name: 5
  sign_in_failures_per_client: 20
  sign_in_window_minutes: 15
  # Wrong passwords re-entered for a sensitive settings change, per administrator and client address, per window.
  settings_password_failures: 5
  # Registrations from one client address per window.
  registrations_per_client: 3
  registration_window_minutes: 60
  # How long a Web sign-in lasts, from the sign-in.
  session_days: 14
  # Web workflow runs at once, every user's together; each user runs one at a time.
  max_concurrent_runs: 2
  # Strategy backtests and ranking backtests the Web API replays at once, every user's together. One more waits its
  # turn. A replay holds years of daily history in memory and a core.
  max_concurrent_backtests: 2
  # Backtests one user may have replaying or waiting before the next is refused. The ranking page asks for two at once.
  max_backtests_per_user: 4
  # Backtests kept per user, to compare them. Saving one more deletes the user's oldest.
  saved_backtests: 20
  # Sign-in with Google. The site offers it when GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are set in the environment or
  # .env and public_origin is set here: all three, or none. docs/web-integration.md has the steps.
  # The address the browser reaches the site at, without a path or a trailing slash, such as
  # https://my-server.my-tailnet.ts.net. It must be https; only http://localhost and http://127.0.0.1 may be http. Its
  # host must be in api.allowed_hosts. Google sends the browser back to <public_origin>/v1/auth/google/callback.
  public_origin: ""
  # Google accounts that sign in as administrators, by their whole email, in any case. No domain wildcards. The first
  # sign-in creates the account, on an installation with no user yet too.
  google_administrator_emails: []
  # Google accounts that sign in as users, whether registration is open or not. An email on neither list signs in
  # with Google only while registration_open is true.
  google_allowed_emails: []
  # Google's OpenID Connect addresses. The token endpoint must be https: the app trusts the ID token because it comes
  # straight from Google over TLS. They have no default: a file without one of them offers no sign-in with Google.
  google_issuer: https://accounts.google.com
  google_authorization_endpoint: https://accounts.google.com/o/oauth2/v2/auth
  google_token_endpoint: https://oauth2.googleapis.com/token
  # Seconds the token endpoint may take to answer.
  google_timeout_seconds: 10
  # Minutes a browser may take at Google between the start of a sign-in and its return.
  google_flow_minutes: 10
  # An administrator without a password confirms a save of the settings by signing in to Google again. Seconds that
  # authentication may be old, and seconds the confirmation then waits for its save.
  google_fresh_authentication_seconds: 300
  # Seconds Google's clock and the server's may differ when an ID token's times are checked.
  google_clock_skew_seconds: 30

# The Shioaji login of a personal site: its realtime quotes, and the SinoPac orders of the runs that choose SinoPac.
# The environment above decides the server and the credentials, which come from the environment or .env only: dev and
# test log in to Shioaji's simulation server with SHIOAJI_API_KEY_TEST and SHIOAJI_SECRET_KEY_TEST; prod logs in to the
# real account with SHIOAJI_API_KEY and SHIOAJI_SECRET_KEY, and orders also need SHIOAJI_CA_PATH, SHIOAJI_CA_PASSWORD
# and SHIOAJI_PERSON_ID.
shioaji:
  # Seconds between two reads of an order's status at the broker.
  poll_interval_seconds: 0.5
  # Reads of an order's status before a working order is cancelled, and again after the cancel request.
  max_polls: 10
  # The cash SinoPac's simulation account started with. That server reports no balance, so the site figures the
  # account's cash from this and SinoPac's records (SimulationCashRule).
  simulation_initial_cash: 1000000

holdings:
  # The largest stocks whose share of the holdings' value the My holdings page shows as the concentration.
  concentration_positions: 3
  # How many days back the SinoPac account page asks the broker for the sales it settled.
  realized_days: 90

watchlist:
  # A TECHNICAL or BUZZ entry stays active through the close of this many trading sessions after its workflow last
  # selected it. 1 keeps Friday evening's Full Cycle entries through Monday's session.
  automatic_expiry_sessions: 1

valuation:
  scenario_spread: 0.2
  max_scan_explanations: 3
  # The sentences of the valuation report (menus 5 and 6).
  not_investment_advice: "This report is only a valuation estimate based on a specified P/E and a summary of the data. It is not investment advice. The result depends on the assumed P/E and is not an objective true value."
  low_pe_caveat: "A low P/E can reflect falling earnings growth, one-off gains that inflate EPS, or market and industry risk; a low P/E alone is not a buy signal."
  ai_not_provided: "(not provided by the AI)"
  undervaluation_formula: "Undervaluation = (fair price − current price) ÷ current price; positive is undervalued, negative is overvalued"
  # The rules the valuation explanation prompt gives the AI. {reason} is why the P/E does not apply.
  no_fair_price_prompt_rule: "No fair price was computed because: {reason}. Do not estimate any fair price, target price, price range, EPS or P/E."
  keep_scenarios_prompt_rule: "Explain the three scenarios. Do not change any P/E, price or percentage, and do not add new ones."
  low_pe_prompt_rule: "At the user's target P/E this stock looks undervalued. Explain that a low P/E can come from falling earnings growth, one-off gains that inflate EPS, or market and sector risk, and that a low P/E alone is not a buy signal."

# Where each outside service lives, the text formats its pages use (MOPS column headers, PTT markers), and the
# headers each scraper sends.
sources:
  exchange:
    twse_daily_quotes_url: "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL"
    tpex_daily_quotes_url: "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes"
    twse_index_url: "https://openapi.twse.com.tw/v1/exchangeReport/MI_INDEX"
    # MI_INDEX lists every TWSE index of its session under Chinese field names. The TAIEX is the row named taiex.
    twse_index_fields:
      { index: "指數", date: "日期", close: "收盤指數", sign: "漲跌", change: "漲跌點數", taiex: "發行量加權股價指數" }
    tpex_index_url: "https://www.tpex.org.tw/openapi/v1/tpex_index"
    # The company profiles list every listed and OTC company with its industry code. The income-statement summaries
