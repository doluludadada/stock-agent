      url: "https://openapi.twse.com.tw/v1/news/newsList"
      title: "Title"
      link: "Url"
      date: "Date"
      stock_code_pattern: "[（(：:]\\s*([0-9]{4,6}[A-Z]?)\\s*[)）]"
    # Each exchange's own reports of any date on its site, which only a personal site reads: they are not the open
    # data above, and TWSE's terms forbid a public site their automated download. quotes_url serves the closing quotes
    # of every security of one date: TWSE's MI_INDEX without warrants (ALLBUT0999), TPEX's without warrants (EW).
    # index_prices_url serves the index's open, high, low and close of each session of a month, index_volume_url the
    # market's volume and the index's change of each session of a month. {date} is the date asked, written as the site
    # reads it. A field is read under its name with the spaces around it removed.
    daily_reports:
      twse:
        quotes_url: "https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date={date:%Y%m%d}&type=ALLBUT0999&response=json"
        quote_fields:
          { stock_id: "證券代號", open: "開盤價", high: "最高價", low: "最低價", close: "收盤價", volume: "成交股數", change: "漲跌價差", sign: "漲跌(+/-)" }
        index_prices_url: "https://www.twse.com.tw/rwd/zh/TAIEX/MI_5MINS_HIST?date={date:%Y%m01}&response=json"
        index_price_fields: { date: "日期", open: "開盤指數", high: "最高指數", low: "最低指數", close: "收盤指數" }
        index_volume_url: "https://www.twse.com.tw/rwd/zh/afterTrading/FMTQIK?date={date:%Y%m01}&response=json"
        index_volume_fields: { date: "日期", volume: "成交股數", change: "漲跌點數" }
        index_volume_lots: false
      tpex:
        quotes_url: "https://www.tpex.org.tw/www/zh-tw/afterTrading/otc?date={date:%Y/%m/%d}&type=EW&response=json"
        quote_fields: { stock_id: "代號", open: "開盤", high: "最高", low: "最低", close: "收盤", volume: "成交股數", change: "漲跌" }
        index_prices_url: "https://www.tpex.org.tw/www/zh-tw/indexInfo/inx?date={date:%Y/%m/01}&response=json"
        index_price_fields: { date: "日期", open: "開市", high: "最高", low: "最低", close: "收市" }
        index_volume_url: "https://www.tpex.org.tw/www/zh-tw/afterTrading/tradingIndex?date={date:%Y/%m/01}&response=json"
        # TPEX named the volume 成交股數（仟股） through 2024-12, in the same board lots.
        index_volume_fields: { date: "日期", volume: "成交張數", change: "漲/跌", earlier_volume: "成交股數（仟股）" }
        index_volume_lots: true
    # Each exchange's ex-right and ex-dividend results of a range of dates on its site (TWSE's TWT49U, TPEX's
    # exDailyQ): each stock's reference price on its ex-day, where the closing quotes compare the close to no reference
    # (TWSE writes X, TPEX a word). A personal site reads them into its daily history, so a dividend shows no gap
    # there; a public site never does. {first} and {last} are the range asked. A quarter per request is measured to
    # work (TWSE 2026-11-12, TPEX 2026-11-14, which serves 2010 and 2017 alike and nothing of 2007).
    ex_right_references:
      reports:
        twse:
          url: "https://www.twse.com.tw/rwd/zh/exRight/TWT49U?startDate={first:%Y%m%d}&endDate={last:%Y%m%d}&response=json"
          date: "資料日期"
          stock_id: "股票代號"
          reference: "除權息參考價"
        tpex:
          url: "https://www.tpex.org.tw/www/zh-tw/bulletin/exDailyQ?startDate={first:%Y/%m/%d}&endDate={last:%Y/%m/%d}&response=json"
          date: "除權息日期"
          stock_id: "代號"
          reference: "除權息參考價"
      months_per_request: 3
