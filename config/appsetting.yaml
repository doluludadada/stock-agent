# Whom the site shows each feature to: off (nobody), administrators, or everyone (every signed-in user; a page that
# needs no sign-in stays open to a visitor). The Web API refuses a hidden feature's requests, and the web app hides its
# pages. A save in the settings page applies at once. A file without this section runs on these same defaults.
features:
  market_overview: everyone
  ranking: everyone
  stock_pages: everyone
  watchlist: everyone
  valuation: administrators
  # The four kinds of analysis run. A user who may start none has no runs page.
  full_cycle: administrators
  specific_stock: administrators
  buzz: administrators
  intraday: administrators
  # The technical-strategy pages.
  strategy_library: administrators
  strategy_designer: administrators
  strategy_backtest: administrators
  # The mock account and every order placed on it.
  mock_account: administrators
  # Reading SinoPac's account as the broker reports it: holdings, cash, settlements, profit and loss, fills. It never
  # orders, and only an administrator reads it.
  sinopac_account: administrators
  # Ordering on SinoPac. Off, no order reaches SinoPac, whatever the environment and whoever the user is. Turning it
  # on grants nothing more: only an administrator may order there, and every order gate still checks each order.
  sinopac_ordering: "off"
  # My holdings: the holdings a user enters by hand, analysed with those of the accounts the site shows the user.
  holdings: everyone
