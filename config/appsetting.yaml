        index_volume_lots: true
    # Each exchange's ex-right and ex-dividend results of a range of dates on its site (TWSE's TWT49U, TPEX's
    # exDailyQ): each stock's reference price on its ex-day, where the closing quotes compare the close to no reference
    # (TWSE writes X, TPEX a word). A personal site reads them into its daily history, so a dividend shows no gap
