# config/appsetting.yaml

# dev: a developer's machine, the mock broker only. test: staging before launch, Shioaji only in simulation with the
# *_TEST key pair. prod: the live service, PostgreSQL only, the only environment for order_mode live. dev and test refuse
# to start while a production Shioaji credential is set. Neither the Web editor nor a reload changes it: restart.
environment: dev

ai:
  # claude reads ANTHROPIC_API_KEY. nvidia (NVIDIA_API_KEY) is configured too; its deepseek model did not answer on
  # 2026-11-03, so Claude Haiku is active.
  active_model: claude
  connection_timeout: 60
  temperature: 0.7
  max_output_tokens: 16000
  available_models:
    openai: gpt-5.5-mini
    grok: grok-4.7
    gemini: gemini-2.5-flash
    groq: openai/gpt-oss-20b
    nvidia: deepseek-ai/deepseek-v4.1-flash
    claude: claude-haiku-5-5
  # The models a user may pick for their own runs on My settings, besides active_model, the default: for example
  # [openai, gemini]. Each needs its entry above and its API key, or the app does not start.
  user_selectable: []
  article_content_length: 500

behavior:
  log_level: DEBUG
  enable_web_search: false
  enable_x_search: false
  enable_inline_citations: true
  web_search_max_results: 3
  web_search_triggers:
    [
      "latest",
      "recent",
      "news",
      "current",
      "today",
      "stock",
      "weather",
      "時事",
      "今天",
      "最新",
      "新聞",
      "查詢",
    ]

db:
  # sqlite keeps everything in stock_agent.db at the project root. postgresql reads DB_USER, DB_PASSWORD, DB_HOST,
  # DB_PORT and DB_NAME from .env, and refuses to start without them instead of falling back to SQLite.
  backend: sqlite
  chroma_persist_path: "chroma_data"

chat:
  reset_commands:
    - clear
    - reset
  reset_reply: "✨ Memory cleared. Let's start over."

technical:
  # The developer's strategies, in menu order: each is config/strategies/<id>.json. Saving settings never changes them.
  built_in_strategies: [conservative, balanced, aggressive]
  # An owner's first settings copy every built-in strategy and select this one for every workflow.
  initial_strategy_id: balanced

folder:
  news_archive_dir: "news_archive"
  buzz_archive_dir: "buzz_archive"
  ai_response_dir: "ai_responses"

tavily:
  search_depth: basic
  connection_timeout: 30

analysis:
  # Daily history is fetched by calendar days, but a strategy counts trading days (bars). About 1.5 calendar days pass
  # per trading day; 1.9 leaves room for the Lunar New Year closure and trading halts. The window is the larger of
  # lookback_days and the strategy's bars x 1.9, so the built-in strategies (61 bars, 116 days) keep the 120-day window.
  # A stock that still gets too few bars fails the technical step; it is never scored on partial history.
  lookback_days: 120
  history_calendar_days_per_bar: 1.9

  technical_weight: 0.5
  ai_weight: 0.5

  min_combined_score_buy: 80
  max_combined_score_sell: 30

  risk_per_trade_pct: 0.02
  stop_loss_pct: 0.10
  # A BUY quantity is a multiple of this many shares: 1 sizes odd lots, 1000 whole board lots.
  lot_size: 1
  # Most AI factors and soft technical failures a decision reason lists.
  reason_item_limit: 3

  article_fetch_limit: 10

notifications:
  enabled: false
  recipients: []

# The Buzz report's social sentiment. Report only: it never changes signals or orders.
sentiment:
  # A post classified with less confidence than this counts as unclear.
  min_confidence: 0.5
  # With fewer bullish, bearish or neutral posts than this, the stock's consensus is unclear.
  min_opinions: 2
  # The share of the opinions one stance needs to be the consensus. Above one half, so only one stance can reach it.
  consensus_share: 0.6

collect_rules:
  spam_keywords:
    - "廣告"
    - "廣編"
    - "業配"
    - "新聞稿"

  financial_keywords:
    - "營收"
    - "EPS"
    - "毛利"
    - "純益"
    - "法說"
    - "殖利率"
    - "擴廠"
    - "減資"
    - "購併"
    - "財報"
    - "股利"
    - "盈餘"
    - "轉盈"

  buzz_min_mentions: 20
  buzz_min_engagement: 100
  social_article_limit: 100

  ptt_lookback_days: 14

  ptt_tags:
    - "[標的]"
    - "[新聞]"

quality:
  min_chars_stock: 100
  min_chars_news: 200
  min_chars_gossip: 50

market:
  fee_rate: 0.001425
  # Securities transaction tax on a SELL: stocks, and ETFs (codes starting with 00).
  tax_rate: 0.003
  etf_tax_rate: 0.001
  # A bond ETF (a 00 code ending in B, such as 00679B) sold on or before this trading date pays no transaction tax;
  # after it, etf_tax_rate.
  bond_etf_tax_exempt_until: 2026-12-31
  min_fee: 20
  # Shares in one board lot, the exchange's trading unit. Fewer shares trade as an intraday odd lot.
  board_lot_shares: 1000
  # The exchanges' price grid, the same on TWSE and TPEx: from each band's lowest price up, a limit price is a multiple
  # of the band's tick, or the exchange refuses the order. Sources, read 2026-10-31: the TWSE trading mechanism page,
  # regular trading, tick sizes (https://www.twse.com.tw/zh/products/system/trading.html), and the TPEx trading system
  # overview, section 4, tick sizes (https://www.tpex.org.tw/zh-tw/mainboard/trading/rules/system.html).
  stock_ticks:
    { 0: "0.01", 10: "0.05", 50: "0.1", 100: "0.5", 500: "1", 1000: "5" }
  etf_ticks: { 0: "0.01", 50: "0.05" }
  # A quote this close to a tick, as a fraction of the tick, is that tick carried through a binary float: Yahoo serves
  # float32 prices, so 28.35 arrives as 28.350000381469727.
  tick_float_tolerance: "0.01"

freshness:
  # Realtime quotes older than this never price an order.
  realtime_max_lag_minutes: 15
  # Daily history whose last bar is older than this is not analysed.
  history_max_lag_days: 10
  # The run error for daily histories that lack the last settled session names at most this many stocks.
  missing_session_listed_stocks: 10
  # An official close that prices a P/E valuation is stale once more weekday sessions than this have closed after
  # its session. One is tolerated because the exchanges publish a day's close hours after 13:30.
  daily_close_max_missed_sessions: 1

# The regular TWSE and TPEx trading day, Asia/Taipei time, Monday to Friday. Orders are taken from the opening
# auction; the closing call auction takes limit ROD orders only.
market_hours:
  opening_auction_start: "08:30"
  continuous_start: "09:00"
  closing_auction_start: "13:25"
  close: "13:30"
  # A session's daily bar is final in every price source from this time: the after-hours fixed-price session ends at
  # 14:30, and delayed feeds such as Yahoo's run 20 minutes behind.
  settled: "15:00"

# How the price and listing adapters pace, batch and cache their requests.
market_data:
  # TWSE MIS realtime quotes: it answers 100 channels per request and refuses 200, and asks for 5 s between requests.
  quote_batch_size: 50
  quote_request_interval_seconds: 5.0
  quote_timeout_seconds: 10.0
  # Yahoo daily history.
  history_batch_size: 50
  history_batch_delay_seconds: 1.5
  # A history that lacks the last settled session is asked for again at most this often.
  history_retry_hours: 2
  history_save_chunk_size: 5000
  # The TWSE and TPEX listings, with each stock's latest official close.
  listing_cache_hours: 6
  listing_timeout_seconds: 30.0

trading:
  execution_provider: mock
  order_mode: mock_only

mock_trading:
  # Each user's mock account starts with this cash the first time it is read.
  initial_cash: 1000000

accounts:
  # Paid AI calls (stock analysis, valuation explanations, Buzz sentiment) a user may make per Taiwan calendar day.
  # Administrators have no such limit; their calls still count toward the server's total below.
  daily_ai_calls: 60
  # Paid AI calls of every user together per Taiwan calendar day. Past it, users' calls are refused until midnight.
  # An administrator's calls count toward it and are never refused.
  daily_ai_calls_total: 600
  # Anyone may register as a user once the first administrator exists. Never on an installation with a real broker.
  registration_open: true
  # Failed sign-ins before the next is refused for the window: per sign-in name and client address, and per address.
  sign_in_failures_per_name: 5
  sign_in_failures_per_client: 20
  sign_in_window_minutes: 15
  # Wrong passwords re-entered for a sensitive settings change, per administrator and client address, per window.
  settings_password_failures: 5
  # Registrations from one client address per window.
  registrations_per_client: 3
  registration_window_minutes: 60
  # How long a Web sign-in lasts, from the sign-in.
  session_days: 14
  # Web workflow runs at once, every user's together; each user runs one at a time.
  max_concurrent_runs: 2

# Used only with trading.execution_provider: shioaji. The environment above decides the server and the credentials,
# which come from the environment or .env only: test logs in to Shioaji's paper-trading server with
# SHIOAJI_API_KEY_TEST and SHIOAJI_SECRET_KEY_TEST; prod logs in to the real account with SHIOAJI_API_KEY,
# SHIOAJI_SECRET_KEY, SHIOAJI_CA_PATH, SHIOAJI_CA_PASSWORD and SHIOAJI_PERSON_ID; dev never uses Shioaji.
shioaji:
  # Seconds between two reads of an order's status at the broker.
  poll_interval_seconds: 0.5
  # Reads of an order's status before a working order is cancelled, and again after the cancel request.
  max_polls: 10

watchlist:
  # A TECHNICAL or BUZZ entry stays active through the close of this many trading sessions after its workflow last
  # selected it. 1 keeps Friday evening's Full Cycle entries through Monday's session.
  automatic_expiry_sessions: 1

valuation:
  scenario_spread: 0.2
  max_scan_explanations: 3
  # The sentences of the valuation report (menus 5 and 6).
  not_investment_advice: "This report is only a valuation estimate based on a specified P/E and a summary of the data. It is not investment advice. The result depends on the assumed P/E and is not an objective true value."
  low_pe_caveat: "A low P/E can reflect falling earnings growth, one-off gains that inflate EPS, or market and industry risk; a low P/E alone is not a buy signal."
  ai_not_provided: "(not provided by the AI)"
  undervaluation_formula: "Undervaluation = (fair price − current price) ÷ current price; positive is undervalued, negative is overvalued"
  # The rules the valuation explanation prompt gives the AI. {reason} is why the P/E does not apply.
  no_fair_price_prompt_rule: "No fair price was computed because: {reason}. Do not estimate any fair price, target price, price range, EPS or P/E."
  keep_scenarios_prompt_rule: "Explain the three scenarios. Do not change any P/E, price or percentage, and do not add new ones."
  low_pe_prompt_rule: "At the user's target P/E this stock looks undervalued. Explain that a low P/E can come from falling earnings growth, one-off gains that inflate EPS, or market and sector risk, and that a low P/E alone is not a buy signal."

# Where each outside service lives, the text formats its pages use (MOPS column headers, PTT markers), and the
# headers each scraper sends.
sources:
  exchange:
    twse_daily_quotes_url: "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL"
    tpex_daily_quotes_url: "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes"
    mis_quotes_url: "https://mis.twse.com.tw/stock/api/getStockInfo.jsp"
  yahoo:
    # Yahoo Finance's symbol for each market index. It serves no TPEX index: ^TWOII answers "possibly delisted".
    index_symbols: { taiex: "^TWII" }
  mops:
    eps_url: "https://mopsov.twse.com.tw/mops/web/ajax_t163sb04"
    eps_form_fields:
      {
        "encodeURIComponent": "1",
        "step": "1",
        "firstin": "1",
        "off": "1",
        "isQuery": "Y",
      }
    twse_market_code: "sii"
    tpex_market_code: "otc"
    company_id_header: "公司代號"
    eps_header_prefix: "基本每股盈餘"
    no_data_marker: "查詢無資料"
    # The company profiles list every listed and OTC company with its industry code. The income-statement summaries
    # list only the companies that filed the latest quarter, a few percent of them early in each filing window.
    twse_industries_url: "https://openapi.twse.com.tw/v1/opendata/t187ap03_L"
    twse_industry_company_field: "公司代號"
    twse_industry_field: "產業別"
    tpex_industries_url: "https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O"
    tpex_industry_company_field: "SecuritiesCompanyCode"
    tpex_industry_field: "SecuritiesIndustryCode"
    # The names the TWSE ISIN listing (isin.twse.com.tw) gives the codes in use on 2026-11-04. A code not listed here,
    # such as 91 for depositary receipts, leaves the company without an industry.
    industry_names:
      {
        "01": "水泥工業",
        "02": "食品工業",
        "03": "塑膠工業",
        "04": "紡織纖維",
        "05": "電機機械",
        "06": "電器電纜",
        "08": "玻璃陶瓷",
        "09": "造紙工業",
        "10": "鋼鐵工業",
        "11": "橡膠工業",
        "12": "汽車工業",
        "14": "建材營造業",
        "15": "航運業",
        "16": "觀光餐旅",
        "17": "金融保險業",
        "18": "貿易百貨業",
        "20": "其他業",
        "21": "化學工業",
        "22": "生技醫療業",
        "23": "油電燃氣業",
        "24": "半導體業",
        "25": "電腦及週邊設備業",
        "26": "光電業",
        "27": "通信網路業",
        "28": "電子零組件業",
        "29": "電子通路業",
        "30": "資訊服務業",
        "31": "其他電子業",
        "32": "文化創意業",
        "33": "農業科技業",
        "35": "綠能環保",
        "36": "數位雲端",
        "37": "運動休閒",
        "38": "居家生活",
      }
    request_interval_seconds: 2.0
    timeout_seconds: 60.0
    provisional_page_max_age_hours: 6
    industry_max_age_hours: 24
    # The latest statutory filing deadline of each quarter across company types, as [month, day]. Financial holdings
    # file last, and the Q4 (annual) report is due in the following year.
    filing_deadlines: { 1: [5, 30], 2: [8, 31], 3: [11, 29], 4: [3, 31] }
    # A deadline on a holiday moves to the next business day, so a quarter's filings count as final only this many
    # days after its deadline.
    filing_grace_days: 7
  ptt:
    base_url: "https://www.ptt.cc"
    search_path: "/bbs/Stock/search"
    push_tag: "推"
    boo_tag: "噓"
    arrow_tag: "→"
    ticker_label_pattern: "股票代碼[^:：]*[:：]\\s*(\\d{4})"
    ticker_parenthesized_pattern: "[（(](\\d{4})[)）]"
    # The last place a post's stock id is looked for: the first four digits in its title.
    title_ticker_pattern: "(\\d{4})"
    posting_reminder_marker: "發文提醒"
    previous_page_label: "上頁"
    timeout_seconds: 15.0
    max_pages: 30
    max_body_length: 3000
    archive_excerpt_length: 500
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    # The Cookie header every request sends: over18=1 answers PTT's age check.
    cookie: "over18=1"
  news:
    cnyes_api_url: "https://api.cnyes.com/media/api/v1"
    cnyes_article_url: "https://news.cnyes.com/news/id/"
    yahoo_base_url: "https://tw.stock.yahoo.com"
    yahoo_quote_url: "https://tw.stock.yahoo.com/quote/"
    cnyes_timeout_seconds: 10.0
    yahoo_timeout_seconds: 15.0
    yahoo_min_headline_length: 5
    yahoo_short_paragraph_length: 20
    cnyes_user_agent: "Mozilla/5.0"
    yahoo_user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  ai:
    grok_base_url: "https://api.x.ai/v1"
    groq_base_url: "https://api.groq.com/openai/v1"
    nvidia_base_url: "https://integrate.api.nvidia.com/v1"
    tavily_search_url: "https://api.tavily.com/search"
  line:
    push_url: "https://api.line.me/v2/bot/message/push"
    multicast_url: "https://api.line.me/v2/bot/message/multicast"
    multicast_timeout_seconds: 10.0
    sentence_endings: "。.！!？?"
    max_message_length: 400
