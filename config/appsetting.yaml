    # MOPS's monthly revenue summary of any past month, one CSV per market code above, ROC year and month: the summary the
    # OpenAPI serves for its latest month alone (sources.exchange.monthly_revenue), with the same column names. A personal
    # site reads it into the open-data archive's monthly revenue (`just backfill-history`); a public site never does.
    monthly_revenue_url: "https://mopsov.twse.com.tw/nas/t21/{market_code}/t21sc03_{roc_year}_{month}.csv"
    # Companies file each month's revenue by this day of the month after it, so a summary served later holds every
    # company, and a decision after it reads that month.
    revenue_deadline_day: 10
    # Every request to MOPS, for a page of income statements or one company's basic information, leaves this far
    # after the one before it. Three requests in ten seconds got the address refused on 2026-11-14; five seconds
    # apart, fourteen of fourteen were answered.
    request_interval_seconds: 5.0
    # A company's basic information, one POST per company to MOPS's JSON API, for its main business and English name,
    # which the exchanges' open data lacks. A personal site alone asks, for a stock whose brief is asked for and with
    # `just backfill-company-background`, and again after sources.mops.company_basics_max_age_days (90). The page
    # address is what a reader opens from the stock page: a template of {stock_id}.
    company_basics_url: "https://mops.twse.com.tw/mops/api/t05st03"
    company_basics_origin: "https://mops.twse.com.tw"
    company_basics_page_url: "https://mopsov.twse.com.tw/mops/web/ajax_t05st03?encodeURIComponent=1&step=1&firstin=1&off=1&queryName=co_id&inpuType=co_id&TYPEK=all&co_id={stock_id}"
    timeout_seconds: 60.0
    provisional_page_max_age_hours: 6
    # The latest statutory filing deadline of each quarter across company types, as [month, day]. Financial holdings
    # file last, and the Q4 (annual) report is due in the following year.
    filing_deadlines: { 1: [5, 30], 2: [8, 31], 3: [11, 29], 4: [3, 31] }
    # A deadline on a holiday moves to the next business day, so a quarter's filings count as final only this many
    # days after its deadline.
    filing_grace_days: 7
  # The exchange's document site, where each company uploads its shareholders'-meeting annual report as a PDF. A
  # personal site alone reads it: for a stock whose brief is asked for and with `just backfill-company-background`,
  # once a year from June, and again each week until the new report appears. A report takes three requests, 5 seconds
  # apart: the page that lists the meeting year's files ({roc_year} is the ROC year of the meeting), the request that
  # answers the file's time-stamped address, and the file. Its text is read in a worker process, and the sections on
  # the business scope, the product mix, the customers of a tenth of sales or more, the industry and the employees
  # are kept as text in the article store, each under the listing page's address.
  annual_reports:
    index_url: "https://doc.twse.com.tw/server-java/t57sb01?step=1&colorchg=1&co_id={stock_id}&year={roc_year}&mtype=F&dtype=F04"
    file_url: "https://doc.twse.com.tw/server-java/t57sb01"
    site_url: "https://doc.twse.com.tw"
    # What marks each section in a report's text, as regular expressions tried in order, read after full-width
    # characters became ordinary ones: the first that matches past the table of contents starts the section's window
    # of sources.annual_reports.section_length (2500) characters. Seen in the reports of 2026: the customers' section is
    # headed by the tenth of sales, written 百分之十 or 10%, of sales alone or of purchases and sales together, and a
    # heading may be written with a space between its characters.
    section_patterns:
      business_scope: ["業務之?主要內容", "業\\s*務\\s*範\\s*圍"]
      product_mix: ["營\\s*業\\s*比\\s*重"]
      major_customers:
        - "[占佔]銷貨總額\\s*(?:百分之十|10\\s*%)"
        - "銷貨客戶"
        - "[占佔]進\\s*\\(銷\\)\\s*貨總額\\s*(?:百分之十|10\\s*%)"
        - "[占佔]進貨總額\\s*(?:百分之十|10\\s*%)"
        - "[占佔]全年度銷貨\\s*淨額\\s*比率"
      industry_overview: ["產業概況", "產業之現況與發展"]
      employees: ["從業員工", "員工人數"]
    # A kept section's title, from the report's ROC fiscal year and the section's heading below.
    title: "{roc_year}年度股東會年報：{section}"
    section_titles:
      business_scope: "業務範圍"
      product_mix: "主要產品及營業比重"
      major_customers: "主要客戶"
      industry_overview: "產業概況"
      employees: "從業員工"
  ptt:
    base_url: "https://www.ptt.cc"
    search_path: "/bbs/Stock/search"
    push_tag: "推"
    boo_tag: "噓"
    arrow_tag: "→"
    ticker_label_pattern: "股票代碼[^:：]*[:：]\\s*(\\d{4})"
    ticker_parenthesized_pattern: "[（(](\\d{4})[)）]"
    # The last place a post's stock id is looked for: the first four digits in its title.
    title_ticker_pattern: "(\\d{4})"
    posting_reminder_marker: "發文提醒"
    previous_page_label: "上頁"
    timeout_seconds: 15.0
    max_pages: 30
    max_body_length: 3000
    archive_excerpt_length: 500
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    # The Cookie header every request sends: over18=1 answers PTT's age check.
    cookie: "over18=1"
  news:
    cnyes_api_url: "https://api.cnyes.com/media/api/v1"
    cnyes_article_url: "https://news.cnyes.com/news/id/"
    yahoo_base_url: "https://tw.stock.yahoo.com"
    yahoo_quote_url: "https://tw.stock.yahoo.com/quote/"
    cnyes_timeout_seconds: 10.0
    yahoo_timeout_seconds: 15.0
    yahoo_min_headline_length: 5
    yahoo_short_paragraph_length: 20
    cnyes_user_agent: "Mozilla/5.0"
    yahoo_user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
  world:
    # The world news feeds, each an RSS 2.0 feed its publisher offers readers, read in this order. A personal site
    # reads all of them; a public site reads only the Federal Reserve's, a United States government work
    # (Audience.world_sources). `source` is cna, bbc or federal_reserve. A file without news_feeds reads no world news.
    news_feeds:
      - { source: cna, url: "https://feeds.feedburner.com/rsscna/intworld" }
      - { source: cna, url: "https://feeds.feedburner.com/rsscna/finance" }
      - { source: bbc, url: "https://feeds.bbci.co.uk/news/business/rss.xml" }
      - { source: federal_reserve, url: "https://www.federalreserve.gov/feeds/press_monetary.xml" }
    # The world indicators' tables, each served without a key by a public agency: the Taiwan Futures Exchange's daily
    # reference exchange rates on its open API, which invites programs to connect and reserves republication, so only
    # a personal site reads it; and the United States Treasury's daily par yield curve, a United States government
    # work any site may read (Audience.world_indicators). `{year}` is the current year. `fields` names the table's
    # column of each indicator: usd_twd, usd_jpy, eur_usd, usd_cny, us_10y_yield, us_2y_yield. No keyless source whose
    # terms allow automated reading serves the US stock indices, the dollar index, crude oil, gold or an ADR on the
    # day, so the site holds none of them. A file without indicator_feeds reads no indicator.
    indicator_feeds:
      - url: "https://openapi.taifex.com.tw/v1/DailyForeignExchangeRates"
        format: json
        date_field: "Date"
        date_format: "%Y%m%d"
        fields: { "USD/NTD": usd_twd, "USD/JPY": usd_jpy, "EUR/USD": eur_usd, "USD/RMB": usd_cny }
      - url: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/{year}/all?type=daily_treasury_yield_curve&field_tdr_date_value={year}&page&_format=csv"
        format: csv
        date_field: "Date"
        date_format: "%m/%d/%Y"
        fields: { "10 Yr": us_10y_yield, "2 Yr": us_2y_yield }
  ai:
    grok_base_url: "https://api.x.ai/v1"
    groq_base_url: "https://api.groq.com/openai/v1"
    nvidia_base_url: "https://integrate.api.nvidia.com/v1"
    tavily_search_url: "https://api.tavily.com/search"
  line:
    push_url: "https://api.line.me/v2/bot/message/push"
    multicast_url: "https://api.line.me/v2/bot/message/multicast"
    multicast_timeout_seconds: 10.0
    sentence_endings: "。.！!？?"
    max_message_length: 400

# Whom the site shows each feature to: off (nobody), administrators, or everyone (every signed-in user; a page that
# needs no sign-in stays open to a visitor). The Web API refuses a hidden feature's requests, and the web app hides its
# pages. A save in the settings page applies at once. A file without this section runs on these same defaults.
features:
  market_overview: everyone
  ranking: everyone
  stock_pages: everyone
  watchlist: everyone
  valuation: administrators
  # The four kinds of analysis run. A user who may start none has no runs page.
  full_cycle: administrators
  specific_stock: administrators
  buzz: administrators
  intraday: administrators
  # The technical-strategy pages.
  strategy_library: administrators
  strategy_designer: administrators
  strategy_backtest: administrators
  # The mock account and every order placed on it.
  mock_account: administrators
  # Reading SinoPac's account as the broker reports it: holdings, cash, settlements, profit and loss, fills. It never
  # orders, and only an administrator reads it.
  sinopac_account: administrators
  # Ordering on SinoPac. Off, no order reaches SinoPac, whatever the environment and whoever the user is. Turning it
  # on grants nothing more: only an administrator may order there, and every order gate still checks each order.
  sinopac_ordering: "off"
  # My holdings: the holdings a user enters by hand, analysed with those of the accounts the site shows the user.
  holdings: everyone
  # The world page and the home page's world block: the world indicators, the day's world brief and the world news.
  # Off, the site also reads no world feed and writes no world brief.
  world: everyone
